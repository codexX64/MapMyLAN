# MapMyLAN installé par le Hub.
# Les {{...}} sont remplacés à l'installation : secrets générés, ports d'hôte,
# volumes nommés et réseau partagé du Hub.
services:
  db:
    image: postgres:16-alpine
    container_name: {{service.host}}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mapmylan
      POSTGRES_PASSWORD: {{config.POSTGRES_PASSWORD}}
      POSTGRES_DB: mapmylan
    ports:
      - "{{hostport.db}}:5432"
    volumes:
      - {{volume.pgdata}}:/var/lib/postgresql/data
    networks: [hub]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapmylan"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7-alpine
    container_name: {{service.host}}-cache
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "{{hostport.cache}}:6379"
    networks: [hub]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Réseau de la machine : le balayage ARP ne traverse pas un pont Docker.
  # Déclaré dans permissions.hostNetwork du manifeste, validé à l'installation.
  api:
    image: ghcr.io/codexx64/mapmylan-backend:{{config.IMAGE_TAG}}
    container_name: {{service.host}}-api
    restart: unless-stopped
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    environment:
      DATABASE_URL: postgresql://mapmylan:{{config.POSTGRES_PASSWORD}}@{{hostport.db}}/mapmylan?schema=public
      REDIS_URL: redis://{{hostport.cache}}
      JWT_SECRET: {{config.JWT_SECRET}}
      MASTER_KEY: {{config.MASTER_KEY}}
      PASSWORD_PEPPER: {{config.PASSWORD_PEPPER}}
      INTEGRATION_TOKEN_SEED: {{config.HUB_TOKEN}}
      ADMIN_TOKEN_SEED: {{config.ADMIN_TOKEN}}
      SCAN_INTERFACE: {{config.SCAN_INTERFACE}}
      SCAN_SUBNET: {{config.SCAN_SUBNET}}
      SCAN_INTERVAL: {{config.SCAN_INTERVAL}}
      PORT: "4000"
      BIND_ADDRESS: {{config.BIND_ADDRESS}}
      NODE_ENV: production
      CORS_ORIGIN: "*"
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      # L'assistant. Le Hub pose ces adresses quand Ollama et VOX existent, et
      # redéploie MapMyLAN quand l'un d'eux arrive : vides, l'assistant répond
      # sans modèle aux questions directes et le mode vocal dit ce qui manque.
      # Adresses « vues de la machine » (hostUrl) : ce conteneur est en réseau
      # hôte et ne résout pas les noms des conteneurs du Hub.
      IA_URL: "{{provider.llm.chat.hostUrl}}"
      IA_MODELE: "{{provider.llm.chat.config.DEFAULT_MODEL}}"
      VOX_URL: "{{provider.voice.stt.hostUrl}}"
      VOX_JETON: "{{provider.voice.stt.config.HUB_TOKEN}}"
      # SYNAPSE, le cerveau du homelab : l'assistant y pose sa fiche et son
      # état, y lit ce que le homelab sait, y remonte ses échanges. Le jeton
      # est un jeton de cerveau dérivé par le Hub, valable pour ce seul service.
      SYNAPSE_URL: "{{provider.memory.brief.hostUrl}}"
      SYNAPSE_JETON: "{{provider.memory.brief.jetonCerveau}}"
      # L'adresse de MapMyLAN pour un humain : les autres IA la donnent pour « continuer ici ».
      SERVICE_UI: "{{service.ui}}"
    depends_on:
      db: { condition: service_healthy }
      cache: { condition: service_healthy }

  web:
    image: ghcr.io/codexx64/mapmylan-frontend:{{config.IMAGE_TAG}}
    container_name: {{service.host}}
    restart: unless-stopped
    networks: [hub]
    ports:
      - "{{hostport.web}}:80"
    environment:
      # nginx relaie /api vers l'API, qui écoute sur l'adresse du pont Docker.
      API_UPSTREAM: "{{config.BIND_ADDRESS}}:4000"
    security_opt: ["no-new-privileges:true"]
    depends_on: [api]

networks:
  hub:
    name: {{hub.network}}
    external: true

volumes:
  {{volume.pgdata}}:
    name: {{volume.pgdata}}
