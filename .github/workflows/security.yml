name: security

# Chaîne d'approvisionnement (OWASP A03) et dépendances (A06) : audit à chaque
# push et pull request, plus une passe hebdomadaire qui rattrape les CVE
# publiées après coup.
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # lundi 06:00 UTC

permissions:
  contents: read

jobs:
  audit:
    name: npm audit + typecheck (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      # Installe à l'identique du lockfile : un lockfile absent ou désynchronisé
      # fait échouer le job (builds reproductibles, SEC-DEP-001).
      - run: npm ci
      # Échoue sur toute vulnérabilité de niveau « high » ou plus (SEC-DEP-002).
      - run: npm audit --audit-level=high
      # Le typage doit passer : c'est aussi ce qui garantit que les correctifs de
      # sécurité de cet audit compilent (backend = tsc, frontend = build Vite).
      - run: npm run build --if-present
      # La suite de tests fait partie du contrôle : elle couvre l'anti-CSRF, la
      # garde de commande, le chiffrement, les validateurs et la poignée de main
      # du flux temps réel. Sans elle dans la CI, rien ne signale une régression.
      - run: npm test --if-present

  coherence:
    name: fichiers partagés identiques
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Le catalogue des fournisseurs de courrier vit en deux exemplaires — les
      # contextes de construction Docker sont séparés. S'ils divergent, l'écran
      # et le serveur ne lisent plus les mêmes réglages : on le fait échouer ici
      # plutôt que de le découvrir sur une boîte mail qui ne se connecte pas.
      - name: backend/mail-providers.js == frontend/public/mail-providers.js
        run: diff -u backend/mail-providers.js frontend/public/mail-providers.js
      # Aucune adresse d'installation réelle dans le dépôt public : les exemples
      # utilisent les plages réservées à la documentation (RFC 5737).
      #
      # Les fichiers de test sont hors périmètre à dessein. Une suite qui vérifie
      # qu'une adresse privée est bien reconnue, ou qu'une garde la refuse, doit
      # en citer une : c'est le sujet du test, pas une fuite. Le contrôle porte
      # donc sur le code livré, la documentation et la démo — là où une adresse
      # réelle finirait publiée.
      #
      # La liste des fichiers vient de git plutôt que des options d'inclusion de
      # grep : leur ordre de priorité avec --exclude n'est pas celui qu'on croit,
      # et le contrôle passait alors qu'il aurait dû échouer.
      - name: aucune adresse d'installation
        run: |
          fichiers=$(git ls-files \
            '*.ts' '*.tsx' '*.js' '*.md' '*.yml' '*.html' \
            | grep -v -e '\.test\.tsx\?$' -e '^\.github/workflows/')
          if printf '%s\n' "$fichiers" | xargs grep -In -E '\b10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\b'; then
            echo "::error::adresse privée trouvée hors des fichiers de test"
            exit 1
          fi

      # Et aucun identifiant d'installation, nulle part, tests compris.
      #
      # La liste vit dans un secret du dépôt : rien dans l'arbre, rien dans
      # l'historique, rien dans les diffs.
      - name: aucun identifiant d'installation
        env:
          MOTIFS: ${{ secrets.FORBIDDEN_PATTERNS }}
        run: |
          if [ -z "$MOTIFS" ]; then
            echo "::error::secret FORBIDDEN_PATTERNS absent"
            exit 1
          fi
          if git ls-files | xargs grep -In -iE "$MOTIFS"; then
            echo "::error::identifiant d'installation trouvé"
            exit 1
          fi

  sbom:
    name: SBOM (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
      # Génère une nomenclature logicielle CycloneDX (SEC-DEP-006).
      - run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.dir }}
          path: ${{ matrix.dir }}/sbom.json

  secrets:
    name: gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Détecte tout secret commité dans l'historique (SEC-TEST-002).
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_SUMMARY: "true"
