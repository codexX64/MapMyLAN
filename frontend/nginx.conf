server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers on the document itself.
  #
  # helmet, on the backend side, only protects the /api responses: it is nginx
  # that serves the HTML and JavaScript, so this is where the content policy
  # must live. Without a CSP on the document, a script injection runs
  # unhindered. "add_header always" so error responses are covered too.
  #
  # connect-src allows the same host and WebSockets (ws:/wss:) for live updates.
  # Uncomment the HSTS line once the service is served over HTTPS.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location / { try_files $uri $uri/ /index.html; }

  # install.sh patches this to 172.17.0.1:4000 (host networking).
  # If you change docker bridge gateway, update install.sh accordingly.
  location /api/ {
    proxy_pass http://172.17.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Real chain of relays: without it, the backend's attempt limiter
    # (key = IP) sees every request coming from nginx and goes blind.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws/ {
    proxy_pass http://172.17.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
