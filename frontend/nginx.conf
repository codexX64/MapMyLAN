server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # En-têtes de sécurité sur le document lui-même.
  #
  # helmet, côté backend, ne protège que les réponses de /api : c'est nginx qui
  # sert le HTML et le JavaScript, donc c'est ici que doit vivre la politique de
  # contenu. Sans CSP sur le document, une injection de script s'exécute sans
  # entrave. « add_header always » pour couvrir aussi les réponses d'erreur.
  #
  # connect-src autorise le même hôte et les WebSocket (ws:/wss:) pour le direct.
  # Décommentez la ligne HSTS une fois le service servi en HTTPS.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location / { try_files $uri $uri/ /index.html; }

  # Adresse du backend, substituée au démarrage du conteneur.
  #
  # Le backend tourne en réseau hôte : nginx le joint par la passerelle du pont
  # Docker, dont l'adresse n'est pas la même partout. Elle était écrite en dur
  # ici, ce qui imposait de reconstruire l'image pour en changer. Elle vient
  # maintenant de `API_UPSTREAM`, dont la valeur par défaut est celle d'avant :
  # une installation qui ne pose pas la variable ne voit aucune différence.
  #
  # Ce fichier est un gabarit : l'entrée du conteneur nginx le passe à envsubst,
  # limité à API_UPSTREAM, avant de le déposer en configuration. Les variables
  # nginx ci-dessous ($host, $uri, $scheme…) ne sont donc pas touchées.
  location /api/ {
    proxy_pass http://${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Chaîne réelle des relais : sans elle, le limiteur de tentatives du backend
    # (clé = IP) voit toutes les requêtes venir de nginx et devient aveugle.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws/ {
    proxy_pass http://${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
