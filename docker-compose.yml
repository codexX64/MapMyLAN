# MapMyLAN seul, sans le Hub : docker compose up -d --build
# Les réglages viennent de .env (voir .env.example) ; la clé maîtresse, d'un
# fichier hors du volume de données (secrets/socle_cle, voir le README).
services:
  mapmylan:
    build: .
    image: mapmylan:local
    container_name: mapmylan
    restart: unless-stopped
    # Réseau de la machine : arp-scan et nmap doivent voir le vrai réseau
    # local, qu'un pont Docker masquerait.
    network_mode: host
    env_file: .env
    environment:
      DATA_DIR: /app/data
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      DOCKER_HOST: tcp://127.0.0.1:2375
      EXTENSIONS_DIR: /app/extensions
      SOCLE_CLE_FILE: /run/secrets/socle_cle
      SOCLE_CLE_ANCIENNE_FILE: /run/secrets/socle_cle_ancienne
    secrets: [socle_cle, socle_cle_ancienne]
    volumes:
      - mapmylan-data:/app/data
      # Supervision de l'hôte, en lecture seule.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # Extensions facultatives, en lecture seule ; le dossier peut rester vide.
      - ./extensions:/app/extensions:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    # nmap, arp-scan et ping ont besoin des sockets bruts (NET_RAW : ARP, ICMP,
    # SYN), et rien d'autre. Docker ne donne aucune capacité à un processus
    # lancé sous un autre compte que root, et no-new-privileges écarte les
    # capacités de fichier : le conteneur part donc en root, avec NET_RAW plus
    # les trois capacités qu'il faut pour en sortir, et setpriv passe aussitôt
    # au compte node en ne gardant que NET_RAW, transmise aux outils (capacité
    # ambiante) ; SETUID, SETGID et SETPCAP quittent l'ensemble limite avant
    # que MapMyLAN ne démarre. Une commande lancée dans le conteneur prend
    # « -u node » (docker compose exec -u node …).
    user: "0:0"
    entrypoint: ["setpriv", "--reuid=node", "--regid=node", "--clear-groups", "--inh-caps=-all,+net_raw", "--ambient-caps=-all,+net_raw", "--bounding-set=-all,+net_raw", "--"]
    cap_drop: [ALL]
    cap_add: [NET_RAW, SETUID, SETGID, SETPCAP]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    # Journaux du conteneur, où part aussi le journal de sécurité : gardés par
    # le démon Docker, hors de portée du service, cinq fichiers de 10 Mo.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on: [docker-socket-proxy]
    # Un entrypoint posé ici efface le CMD de l'image : la commande est redite.
    command: ["node", "--disable-warning=ExperimentalWarning", "src/main.js"]

  # Proxy en lecture seule devant le socket Docker : MapMyLAN liste les
  # conteneurs de la machine, rien d'autre. Monter le socket lui-même donnerait
  # le contrôle du démon — donc de la machine — au premier défaut.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: mapmylan-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1   # GET /containers : le seul besoin
      POST: 0         # aucune écriture
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
      SECRETS: 0
      SERVICES: 0
      INFO: 0
      SYSTEM: 0
    ports:
      # La boucle locale seulement : MapMyLAN (réseau hôte) l'atteint, personne d'autre.
      - "127.0.0.1:2375:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Pas de read_only : l'image écrit sa configuration HAProxy au démarrage.
    # Le reste tient : socket en lecture seule, aucune capacité, aucune élévation.
    tmpfs:
      - /run
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64

secrets:
  socle_cle:
    file: ./secrets/socle_cle
  # Vide, sauf pendant une rotation (README, « Tourner la clé maîtresse »).
  socle_cle_ancienne:
    file: ./secrets/socle_cle_ancienne

volumes:
  mapmylan-data:
